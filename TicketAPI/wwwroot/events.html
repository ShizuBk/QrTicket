<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cartelera de Eventos | Partenón</title>
        <link rel="stylesheet" href="css/events-styles.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    </head>
    <body>
        <nav class="main-navbar">
            <div class="nav-container">
                <div class="nav-logo">
                    <img src="assets/images/logo-partenon.png" alt="Logo Partenón" class="logo-img">
                </div>
                <div class="nav-title">
                    <h1>Eventos Especiales</h1>
                    <p class="nav-subtitle">Vive experiencias únicas</p>
                </div>
                <div class="nav-actions">
                    <a href="index.html" class="btn-home">Volver al Inicio</a>
                </div>
            </div>
        </nav>

        <div class="main-wrapper">
            <main class="container">
                <div id="events-grid" class="events-grid">
                    <p style="text-align: center; grid-column: 1/-1; color: white;">Cargando cartelera...</p>
                </div>
            </main>
        </div>

        <footer class="main-footer">
            <div class="footer-container">
                <div class="footer-info">
                    <p class="municipio-name">H. Ayuntamiento Municipal de Zihuatanejo de Azueta.</p>
                    <p class="copyright">&copy; 2026 Partenón Zihuatanejo. Todos los derechos reservados.</p>
                </div>
                <div class="footer-social">
                    <div class="social-icons">
                        <a href="https://www.facebook.com/profile.php?id=61586548715392" class="social-link" title="Facebook" target="_blank" rel="noopener noreferrer">
                            <span class="icon">FB</span>
                        </a>
                        <a href="#" class="social-link">IG</a>
                        <a href="#" class="social-link">TW</a>
                    </div>
                </div>
            </div>
        </footer>
        <script src="js/events.js"></script>
    </body>
</html>
