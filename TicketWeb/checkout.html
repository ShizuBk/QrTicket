<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletos | Partenón Zihuatanejo</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .ticket-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9f9f9;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #eee;
        }
        .ticket-info label { display: block; font-weight: bold; margin-bottom: 2px; }
        .ticket-info span { font-size: 0.85em; color: #666; }
        
        .qty-input {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
            width: 80px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="checkout-container">
    
    <div class="col-datos">
        <div class="header-ticket">
            <h2>Partenón Zihuatanejo</h2>
            <p>Emisión de Boletos Digitales</p>
        </div>

        <div class="section-title">Datos del Titular</div>
        <div class="input-grid">
            <div class="form-group">
                <label>Nombre(s)</label>
                <input type="text" id="titularName" placeholder="Ej. Vannya">
            </div>
            <div class="form-group">
                <label>Apellido P.</label>
                <input type="text" id="titularLastName" placeholder="Pérez">
            </div>
            <div class="form-group">
                <label>Apellido M.</label>
                <input type="text" id="titularSurname" placeholder="García">
            </div>
        </div>

        <div class="form-group" style="margin-top: 15px;">
            <label>Correo Electrónico</label>
            <input type="email" id="email" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="section-title">Selección de Boletos</div>
        <div id="contenedorBoletos">
            <div class="ticket-row">
                <div class="ticket-info">
                    <label>General</label>
                    <span>$100.00 MXN</span>
                </div>
                <input type="number" class="qty-input" data-tipo="General" data-precio="250" value="0" min="0" oninput="actualizarPrecios()">
            </div>

            <div class="ticket-row">
                <div class="ticket-info">
                    <label>Local</label>
                    <span>$50.00 MXN</span>
                </div>
                <input type="number" class="qty-input" data-tipo="Local" data-precio="150" value="0" min="0" oninput="actualizarPrecios()">
            </div>

            <div class="ticket-row">
                <div class="ticket-info">
                    <label>Estudiante / Niño (+5)</label>
                    <span>$20.00 MXN</span>
                </div>
                <input type="number" class="qty-input" data-tipo="Estudiante" data-precio="100" value="0" min="0" oninput="actualizarPrecios()">
            </div>

            <div class="ticket-row">
                <div class="ticket-info">
                    <label>Adulto Mayor (INAPAM) / Persona C/D.</label>
                    <span>$00.00 MXN</span>
                </div>
                <input type="number" class="qty-input" data-tipo="INAPAM" data-precio="100" value="0" min="0" oninput="actualizarPrecios()">
            </div>
            
        </div>
    </div>

    <div class="col-pago">
        <div class="section-title">Método de Pago</div>
        
        <div class="card-simulation">
            <div class="form-group">
                <label>Número de Tarjeta</label>
                <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="16">
            </div>
            <div class="input-grid" style="grid-template-columns: 1fr 1fr; margin-top: 10px;">
                <div class="form-group">
                    <label>Expira</label>
                    <input type="text" id="exp" placeholder="MM/YY" maxlength="5">
                </div>
                <div class="form-group">
                    <label>CVV</label>
                    <input type="password" id="cvv" placeholder="CVV" maxlength="3">
                </div>
            </div>
        </div>

        <div class="payment-box">
            <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotal">$0.00</span>
            </div>
            <div class="summary-row total">
                <span>Total a Pagar (MXN)</span>
                <span id="totalPrice">$0.00</span>
            </div>

            <button class="btn-pay" id="btnPagar" onclick="simularCobro()">
                Confirmar Pago y Descargar Ticket
            </button>
        </div>
    </div>
    
    <a href="index.html" class="nav-link">← Volver al inicio</a>
</div>

<script src="js/main.js"></script>
</body>
</html>
